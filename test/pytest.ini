[pytest]
# rootdir for this suite is `test/`. Running `pytest test/backend` from the
# repo root finds this file by walking up from the argument, so no -c flag
# is needed.
testpaths = backend e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    live: hits a real running backend; skipped unless E2E_BASE_URL is set
filterwarnings =
    ignore::DeprecationWarning
