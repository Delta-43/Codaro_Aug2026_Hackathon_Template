# Lint config for the backend. Deliberately narrow: this exists to catch dead
# code (unused imports, unused locals, redefinitions), not to enforce a style.
# Widening the rule set is a separate decision from keeping the tree clean.
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["__pycache__"]

[tool.ruff.lint]
select = [
    "F401",  # unused import
    "F811",  # redefinition of unused name
    "F821",  # undefined name — catches a call left behind by a moved helper
    "F841",  # local variable assigned but never used
]
