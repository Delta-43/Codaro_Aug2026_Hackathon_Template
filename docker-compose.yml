services:
  backend:
    # Build from the repo root (not ./backend) so the Dockerfile can COPY the
    # repo-root files the backend reads, domain.config.json + supabase/. The
    # volume mount below shadows the image for hot-reload during dev.
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    # Local dev keeps hot-reload; the image's default CMD is the prod command
    # (no --reload, binds $PORT) used by Railway.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /workspace/backend
    # whole repo is mounted (not just backend/) so app/config.py and
    # app/schema_setup.py can walk up to domain.config.json / supabase/
    # at the repo root, exactly as they do when run natively.
    volumes:
      - .:/workspace

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
