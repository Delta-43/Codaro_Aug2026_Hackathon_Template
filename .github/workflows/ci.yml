name: CI

# Runs on every pull request into staging (develop) and production (main),
# plus on direct pushes to those branches so the branch tip is always known-good.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run — no point burning
# minutes on a commit nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: domain.config.json is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # domain.config.json is the pivot file the whole engine reads from.
      # A typo here breaks the backend at startup and every label in the UI,
      # so it gets its own fast-failing job.
      - name: Validate the pivot config
        run: python .github/scripts/validate_domain_config.py

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            test/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r test/requirements-test.txt

      # Catches dead code (unused imports/locals) that would otherwise only be
      # found by reading. Deliberately a narrow rule set — see backend/pyproject.toml.
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      # The suite stubs out Supabase entirely (see test/backend/fakes.py), so
      # CI needs no credentials and never touches the network. These dummy
      # values only exist so `get_supabase()` does not KeyError on import.
      #
      # `test/e2e` needs a running stack and is skipped automatically because
      # E2E_BASE_URL is deliberately not set here — it still gets collected,
      # so a broken import in those files fails the build rather than hiding.
      - name: Run tests
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_KEY: ci-dummy-key
        run: python -m pytest test -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      # Unused files, exports and dependencies. Green as of this commit, so it
      # gates — if it starts failing, something genuinely became unreachable.
      - name: Unused code (knip)
        working-directory: frontend
        run: npx knip

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
