name: Feature / task
description: Something to build or change. Start here — every branch comes from an issue.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Once this issue is created, note its number (e.g. `#42`) — you will
        name your branch after it and reference it in your pull request.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the engine does this touch?
      options:
        - backend (FastAPI, rules, routers)
        - frontend (Next.js UI)
        - supabase (schema.sql)
        - domain.config.json (the pivot file)
        - tests / CI
        - other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: One sentence on the outcome, not the implementation.
      placeholder: Owners should be able to close a slot so nobody can book it.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What is broken or missing without it?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How a reviewer will confirm this works.
      value: |
        - [ ]
        - [ ] Covered by a test under `test/`
    validations:
      required: true

  - type: checkboxes
    id: pivot
    attributes:
      label: Pivot check
      description: This engine must survive a domain change via `domain.config.json` alone.
      options:
        - label: This change introduces no hard-coded domain word (say "resource", never "room"/"doctor") and no magic number that belongs in `rules`.
