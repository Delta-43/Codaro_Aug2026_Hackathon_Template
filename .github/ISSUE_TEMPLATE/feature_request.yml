name: Feature request
description: Propose something new, or a change to how something works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: config
    attributes:
      label: Could this be config instead of code?
      description: >
        Arbor pivots through domain.config.json rather than through new code paths.
        Anything domain-specific should usually become a config key or a metadata
        field, not a hard-coded behavior. See docs/PIVOT-SYSTEM.md.
      options:
        - "No — this is engine behavior, not domain vocabulary"
        - "Maybe — it might fit an existing config block"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
