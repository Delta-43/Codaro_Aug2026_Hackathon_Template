name: Bug report
description: Something behaves incorrectly.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend (FastAPI, rules, routers)
        - frontend (Next.js UI)
        - supabase (schema.sql)
        - domain.config.json (the pivot file)
        - tests / CI
        - other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the request or the click path.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the error, status code, or `make logs` output.
    validations:
      required: true

  - type: input
    id: config
    attributes:
      label: Relevant domain.config.json values
      description: Rule-dependent bugs usually trace back to a config value.
      placeholder: cancellationWindowHours = 24, maxBookingsPerSlot = 1
