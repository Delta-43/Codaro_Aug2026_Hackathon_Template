name: Bug report
description: Something behaves differently from how it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A failing test is ideal.
      placeholder: |
        1. Sign in as the demo owner
        2. Open /owner/requests
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Tag, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Backend (FastAPI)
        - Frontend (Next.js)
        - Database / RLS (Supabase)
        - Config / pivot system
        - Deployment (Docker, Railway, Vercel)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you are running it, and anything unusual about your setup.
      placeholder: |
        Running via: make start (Docker) / native / hosted
        OS: 
        Python / Node: 
        Custom domain.config.json: yes / no
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Backend traceback or browser console output. Redact any keys before pasting.
      render: shell
    validations:
      required: false
