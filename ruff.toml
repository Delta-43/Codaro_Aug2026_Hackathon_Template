# Lint config for every Python file in the repo, backend/, test/, scripts/ and
# .github/scripts/. Deliberately narrow: this exists to catch dead code, not to
# enforce a style. Widening the rule set is a separate decision.
#
# Lives at the root as ruff.toml rather than pyproject.toml on purpose: a root
# pyproject.toml would also become pytest's rootdir anchor, and this file has no
# business changing test collection.
target-version = "py312"
line-length = 100
exclude = ["__pycache__", ".venv", "test/.venv", ".ds-sync", ".design-sync"]

[lint]
select = [
    "F401",  # unused import
    "F811",  # redefinition of unused name
    "F821",  # undefined name, catches a call left behind by a moved helper
    "F841",  # local variable assigned but never used
]
